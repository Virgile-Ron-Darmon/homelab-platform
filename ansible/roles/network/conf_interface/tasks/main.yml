- name: Comment out baked-in DHCP stanza
  replace:
    path: /etc/network/interfaces
    regexp: '^([ \t]*(auto|allow-hotplug|iface)[ \t]+{{ target_interface }}(?=[ \t]|$).*)$'
    replace: '# \1'

- name: Drop static config for {{ target_interface }}
  template:
    src: config.j2
    dest: /etc/network/interfaces.d/{{ target_interface }}
    mode: '0644'

- name: Stop dhcpcd touching {{ target_interface }} or resolv.conf
  lineinfile:
    path: /etc/dhcpcd.conf
    line: "{{ item }}"
    create: true
    mode: '0644'
  loop:
    - "denyinterfaces {{ target_interface }}"
    - "nohook resolv.conf"

- name: Restart interface, detached so losing SSH doesn't stop it
  command: >
    systemd-run --on-active=2 sh -c
    'ifdown --force {{ target_interface }};
     dhcpcd -x {{ target_interface }} 2>/dev/null;
     pkill -f "[d]hclient.*{{ target_interface }}";
     ip addr flush dev {{ target_interface }};
     ifup --force {{ target_interface }}'

- name: Reconnect on the new IP
  set_fact:
    ansible_host: "{{ target_static_ip }}"

- meta: reset_connection

- wait_for_connection:
    delay: 10
    timeout: 120

- setup:
    gather_subset: [network]

- name: Verify
  assert:
    that: ansible_facts[target_interface].ipv4.address == target_static_ip

- name: Write resolv.conf
  template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: '0644'