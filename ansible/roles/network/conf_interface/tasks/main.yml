- name: Comment out baked-in DHCP stanza
  replace:
    path: /etc/network/interfaces
    regexp: '^(\s*(auto|allow-hotplug|iface)\s+{{ target_interface }}\s.*)$'
    replace: '# \1'

- name: Drop static config for {{ target_interface }}
  template:
    src: config.j2
    dest: /etc/network/interfaces.d/{{ target_interface }}
    mode: '0644'

- name: Restart interface, detached so losing SSH doesn't stop it
  command: >
    systemd-run --on-active=2 sh -c
    'ifdown {{ target_interface }}; pkill -f "dhclient.*{{ target_interface }}";
     ip addr flush dev {{ target_interface }}; ifup {{ target_interface }}'

- name: Reconnect on the new IP
  set_fact:
    ansible_host: "{{ target_static_ip }}"

- meta: reset_connection

- wait_for_connection:
    delay: 10
    timeout: 120

- setup:
    gather_subset: [network]

- name: Verify
  assert:
    that: ansible_facts[target_interface].ipv4.address == target_static_ip