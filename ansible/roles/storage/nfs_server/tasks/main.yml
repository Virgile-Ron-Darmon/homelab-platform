---
# Installs the kernel NFS server and shares one folder with a fixed list of
# client addresses.
#
# Required variables: nfs_clients, platform_roles

- name: Check the client list
  ansible.builtin.assert:
    that:
      - nfs_clients is defined
      - nfs_clients | length > 0
    fail_msg: Set nfs_clients to the addresses allowed to mount {{ nfs_export_path }}.
    quiet: true

- name: Install the NFS server
  ansible.builtin.include_role:
    name: "{{ platform_roles }}/apt/apt_install"
  vars:
    packages:
      - nfs-kernel-server

- name: Create {{ nfs_export_path }}
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the export
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports.d/{{ nfs_exports_name }}.exports
    mode: "0644"
  notify: Reload NFS exports

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started

- name: Apply the export now
  ansible.builtin.meta: flush_handlers

- name: Check the folder is exported
  ansible.builtin.command: exportfs -v
  register: nfs_exportfs
  changed_when: false
  failed_when: nfs_export_path not in nfs_exportfs.stdout
