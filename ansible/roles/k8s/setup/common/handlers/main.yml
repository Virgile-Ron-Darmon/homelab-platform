---
# Handlers run in this order, so the trust store is rebuilt before
# containerd restarts and reads it.
- name: Apply sysctls
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Update CA certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
